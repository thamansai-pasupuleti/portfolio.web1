<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Rivera | Personal Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --dark: #0f172a;
      --text: #1e293b;
      --muted: #64748b;
      --light: #f8fafc;
      --white: #ffffff;
      --border: #e2e8f0;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
      --radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--light);
      color: var(--text);
      line-height: 1.6;
    }

    h1, h2, h3 {
      font-family: 'Playfair Display', serif;
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 20px rgba(0,0,0,0.05);
      z-index: 1000;
    }

    .nav-container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--dark);
      text-decoration: none;
    }

    .logo span {
      color: var(--primary);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 6rem 1.5rem 4rem;
      background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
    }

    .hero-content {
      max-width: 1150px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    .hero-text h1 {
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      line-height: 1.2;
      color: var(--dark);
      margin-bottom: 1rem;
    }

    .hero-text h1 span {
      color: var(--primary);
    }

    .hero-text .title {
      font-size: 1.25rem;
      color: var(--primary);
      font-weight: 500;
      margin-bottom: 1.2rem;
    }

    .hero-text p {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 2rem;
      max-width: 500px;
    }

    .hero-buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 0.85rem 1.8rem;
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .btn-outline {
      border: 2px solid var(--primary);
      color: var(--primary);
    }

    .btn-outline:hover {
      background: var(--primary);
      color: white;
    }

    .hero-image {
      text-align: center;
    }

    .hero-image img {
      width: 100%;
      max-width: 380px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      object-fit: cover;
      aspect-ratio: 1;
    }

    /* Sections common */
    section {
      padding: 5rem 1.5rem;
    }

    .container {
      max-width: 1150px;
      margin: 0 auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-title h2 {
      font-size: 2.3rem;
      color: var(--dark);
      margin-bottom: 0.5rem;
    }

    .section-title p {
      color: var(--muted);
    }

    /* About */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 3.5rem;
      align-items: center;
    }

    .about-img img {
      width: 100%;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .about-text h3 {
      font-size: 1.6rem;
      margin-bottom: 1rem;
      color: var(--dark);
    }

    .about-text p {
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .info-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin-top: 1.5rem;
    }

    .info-list div {
      font-size: 0.95rem;
    }

    .info-list strong {
      color: var(--dark);
    }

    /* Skills */
    .skills {
      background: white;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .skill-card {
      background: var(--light);
      padding: 1.8rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      transition: transform 0.3s;
    }

    .skill-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow);
    }

    .skill-card h4 {
      font-size: 1.15rem;
      margin-bottom: 0.8rem;
      color: var(--dark);
    }

    .skill-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .skill-bar span {
      display: block;
      height: 100%;
      background: var(--primary);
      border-radius: 10px;
    }

    /* Projects */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .project-card {
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.3s;
    }

    .project-card:hover {
      transform: translateY(-8px);
    }

    .project-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .project-body {
      padding: 1.5rem;
    }

    .project-body h3 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      color: var(--dark);
    }

    .project-body p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .project-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .tag {
      background: #e0e7ff;
      color: var(--primary);
      font-size: 0.75rem;
      padding: 0.25rem 0.7rem;
      border-radius: 50px;
      font-weight: 500;
    }

    /* Achievements */
    .achievements {
      background: var(--dark);
      color: white;
    }

    .achievements .section-title h2,
    .achievements .section-title p {
      color: white;
    }

    .achievements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .achieve-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 2rem 1.5rem;
      border-radius: var(--radius);
      text-align: center;
    }

    .achieve-card .number {
      font-size: 2.5rem;
      font-weight: 700;
      color: #818cf8;
      margin-bottom: 0.5rem;
    }

    .achieve-card h4 {
      font-size: 1.1rem;
      margin-bottom: 0.4rem;
    }

    .achieve-card p {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    /* Contact */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 3rem;
    }

    .contact-info h3 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--dark);
    }

    .contact-info p {
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
    }

    .contact-item .icon {
      width: 45px;
      height: 45px;
      background: #e0e7ff;
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .contact-form {
      background: white;
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    /* Footer */
    footer {
      background: var(--dark);
      color: rgba(255,255,255,0.7);
      text-align: center;
      padding: 2rem 1.5rem;
    }

    footer a {
      color: #818cf8;
      text-decoration: none;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .hero-content,
      .about-grid,
      .contact-grid {
        grid-template-columns: 1fr;
        gap: 2.5rem;
      }

      .hero-image {
        order: -1;
      }
    }

    @media (max-width: 700px) {
      .nav-links {
        display: none;
      }

      .menu-btn {
        display: block;
      }

      .info-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <nav>
